[metadata]
name = djangoldp_open_world_model
version = attr: djangoldp_open_world_model.__version__
description = Extends the DjangoLDP model to support the open world assumption
long_description = file: README.md
author = Siol Data
license = MIT
classifiers =
    Programming Language :: Python :: 3

[options]
packages = find:
install_requires =
    djangoldp~=5.1.1
include_package_data = true

[semantic_release]
version_source = tag
version_variable = djangoldp_open_world_model/__init__.py:__version__
commit_parser = commit_parser.parse
